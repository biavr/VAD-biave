<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAD Live Training Dashboard</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #fcfcfb; --surface: #ffffff; --surface-sunken: #f3f2ef; --border: #e4e2dc;
    --text-primary: #17160f; --text-secondary: #57564c; --text-muted: #918f82;
    --accent: #2a78d6; --good: #1baf7a; --warn: #eda100; --grid-line: #e9e7e0;
    --font-display: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141310; --surface: #1b1a16; --surface-sunken: #221f19; --border: #332f26;
      --text-primary: #f3f1e9; --text-secondary: #b9b6a8; --text-muted: #817e70;
      --accent: #3987e5; --good: #199e70; --warn: #c98500; --grid-line: #2a2720;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141310; --surface: #1b1a16; --surface-sunken: #221f19; --border: #332f26;
    --text-primary: #f3f1e9; --text-secondary: #b9b6a8; --text-muted: #817e70;
    --accent: #3987e5; --good: #199e70; --warn: #c98500; --grid-line: #2a2720;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font-display); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 22px; }

  header.page { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 20px; }
  header.page h1 { font-size: 1.3rem; margin: 0; letter-spacing: -0.01em; }
  .status { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-secondary); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .status .dot.live { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

  .meta-row { display: flex; flex-wrap: wrap; gap: 8px 10px; }
  .meta-chip { font-family: var(--font-mono); font-size: 0.74rem; color: var(--text-secondary); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px; white-space: nowrap; }
  .meta-chip b { color: var(--text-primary); font-weight: 600; }

  .empty-state { background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; padding: 36px 20px; text-align: center; color: var(--text-secondary); font-size: 0.9rem; }
  .empty-state .spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); margin: 0 auto 12px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 10px; }
  .panel-hero { padding: 20px 20px 12px; }
  .panel h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); margin: 0 0 2px; font-weight: 600; }
  .panel .big-value { font-family: var(--font-mono); font-size: 1.6rem; color: var(--text-primary); margin: 0 0 10px; }
  .panel .big-value span { font-size: 0.85rem; color: var(--text-muted); font-weight: 400; margin-left: 6px; }

  .legend-row { display: flex; align-items: center; gap: 14px; font-size: 0.74rem; color: var(--text-muted); margin-bottom: 4px; flex-wrap: wrap; }
  .legend-row .item { display: flex; align-items: center; gap: 5px; }
  .legend-row .swatch { width: 14px; height: 2px; border-radius: 2px; }
  .legend-row .swatch.line { background: var(--accent); }
  .legend-row .swatch.dash { background: repeating-linear-gradient(to right, var(--text-muted) 0 3px, transparent 3px 6px); }
  .legend-row .dot2 { width: 7px; height: 7px; border-radius: 50%; background: var(--good); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--good); }

  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  svg.chart .grid-line { stroke: var(--grid-line); stroke-width: 1; }
  svg.chart .axis-label { fill: var(--text-muted); font-family: var(--font-mono); font-size: 9px; }
  svg.chart .epoch-line { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 3; }
  svg.chart .epoch-label { fill: var(--text-muted); font-family: var(--font-mono); font-size: 9px; }
  svg.chart .series-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .ckpt-dot { fill: var(--good); stroke: var(--surface); stroke-width: 2; }
  svg.chart .crosshair { stroke: var(--text-muted); stroke-width: 1; opacity: 0; pointer-events: none; }
  svg.chart .hover-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; opacity: 0; pointer-events: none; }
  svg.chart .capture { fill: transparent; cursor: crosshair; }

  .tooltip { position: absolute; pointer-events: none; opacity: 0; transition: opacity 80ms ease; background: var(--text-primary); color: var(--bg); font-family: var(--font-mono); font-size: 11px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; z-index: 5; transform: translate(-50%, -100%); }
  .chart-holder { position: relative; }

  .grid-multiples { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 760px) { .grid-multiples { grid-template-columns: repeat(2, 1fr); } }
  .mini-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px 8px; }
  .mini-panel h3 { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); margin: 0 0 1px; font-weight: 600; }
  .mini-panel .mini-value { font-family: var(--font-mono); font-size: 0.95rem; color: var(--text-primary); margin: 0 0 4px; }
  .mini-panel .mini-value .delta { font-size: 0.68rem; margin-left: 4px; }
  .mini-panel .mini-value .delta.down { color: var(--good); }
  .mini-panel .mini-value .delta.up { color: var(--warn); }

  footer.note { font-size: 0.78rem; color: var(--text-muted); line-height: 1.5; padding-top: 4px; }
  code { font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>VAD Live Training Dashboard</h1>
    <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">connecting…</span></div>
  </header>

  <div class="meta-row" id="meta-row"></div>

  <div id="empty-state" class="empty-state">
    <div class="spinner"></div>
    Waiting for the first logged iteration…<br>
    <span style="font-size:0.8rem">Nothing to show until <code>scalars.json</code> has its first line.</span>
  </div>

  <div id="dashboard" hidden>
    <section class="panel panel-hero">
      <div class="legend-row">
        <span class="item"><span class="swatch line"></span> total loss</span>
        <span class="item"><span class="swatch dash"></span> epoch boundary</span>
        <span class="item"><span class="dot2"></span> checkpoint saved</span>
      </div>
      <h2>Total loss</h2>
      <p class="big-value" id="hero-value">—</p>
      <div class="chart-holder" id="hero-holder">
        <svg class="chart" id="hero-chart" viewBox="0 0 900 260" preserveAspectRatio="none"></svg>
        <div class="tooltip" id="hero-tooltip"></div>
      </div>
    </section>

    <section style="margin-top:16px">
      <div class="grid-multiples" id="mini-grid"></div>
    </section>
  </div>

  <footer class="note" id="footer-note"></footer>
</div>

<script>
(function(){
  "use strict";
  let DATA = [];
  let CKPT_EPOCHS = [];
  let lastUpdate = null;

  function fmt(v, d=3){ return (v===undefined||v===null||Number.isNaN(v)) ? "–" : Number(v).toFixed(d); }

  function epochStarts(){
    const starts = {};
    DATA.forEach(d => { if (!(d.epoch in starts)) starts[d.epoch] = d.step; });
    return starts;
  }

  function ckptSteps(){
    const starts = epochStarts();
    const epochs = Object.keys(starts).map(Number).sort((a,b)=>a-b);
    return CKPT_EPOCHS.map(e => {
      const next = starts[e+1];
      if (next) return next - (DATA.length>1 ? (DATA[1].step-DATA[0].step) : 50);
      return DATA.length ? DATA[DATA.length-1].step : 0;
    }).filter(s => s !== undefined);
  }

  function buildChart(svg, field, opts={}){
    const W = 900, H = opts.height || 260;
    const padL = 44, padR = 14, padT = 14, padB = 22;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    if (DATA.length < 2) { svg.innerHTML = ""; return; }

    const xs = DATA.map(d => d.step);
    const ys = DATA.map(d => d[field]);
    const xMin = xs[0], xMax = xs[xs.length-1];
    let yMin = Math.min(...ys), yMax = Math.max(...ys);
    const pad = (yMax - yMin) * 0.12 || 1;
    yMin -= pad; yMax += pad;

    const xScale = x => padL + (x - xMin) / (xMax - xMin || 1) * innerW;
    const yScale = y => padT + innerH - (y - yMin) / (yMax - yMin || 1) * innerH;

    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = "";
    const ns = "http://www.w3.org/2000/svg";
    const g = (tag, attrs) => { const el = document.createElementNS(ns, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };

    const yTicks = 4;
    for (let i=0;i<=yTicks;i++){
      const val = yMin + (yMax-yMin)*i/yTicks;
      const yy = yScale(val);
      svg.appendChild(g("line",{class:"grid-line", x1:padL, x2:W-padR, y1:yy, y2:yy}));
      const t = g("text",{class:"axis-label", x: padL-6, y: yy+3, "text-anchor":"end"});
      t.textContent = fmt(val, Math.abs(val) < 2 ? 3 : 1);
      svg.appendChild(t);
    }

    const starts = epochStarts();
    const epochs = Object.keys(starts).map(Number).sort((a,b)=>a-b);
    epochs.forEach(ep => {
      if (ep === epochs[0]) return;
      const xx = xScale(starts[ep]);
      svg.appendChild(g("line",{class:"epoch-line", x1:xx, x2:xx, y1:padT, y2:padT+innerH}));
      if (opts.labelEpochs){
        const t = g("text",{class:"epoch-label", x:xx+3, y:padT+9});
        t.textContent = "epoch " + ep;
        svg.appendChild(t);
      }
    });

    const pathD = DATA.map((d,i) => (i===0?"M":"L") + xScale(d.step).toFixed(2) + "," + yScale(d[field]).toFixed(2)).join(" ");
    svg.appendChild(g("path",{class:"series-line", d:pathD}));

    if (opts.showCheckpoints){
      ckptSteps().forEach(cs => {
        const nearest = DATA.reduce((a,b)=> Math.abs(b.step-cs)<Math.abs(a.step-cs)?b:a);
        svg.appendChild(g("circle",{class:"ckpt-dot", cx:xScale(nearest.step), cy:yScale(nearest[field]), r:4.5}));
      });
    }

    const crosshair = g("line",{class:"crosshair", x1:0,x2:0,y1:padT,y2:padT+innerH});
    const hoverDot = g("circle",{class:"hover-dot", r:4});
    svg.appendChild(crosshair);
    svg.appendChild(hoverDot);
    const capture = g("rect",{class:"capture", x:padL, y:padT, width:innerW, height:innerH});
    svg.appendChild(capture);

    const tooltip = opts.tooltipEl;
    function onMove(evt){
      const rect = svg.getBoundingClientRect();
      const px = (evt.clientX - rect.left) / rect.width * W;
      const frac = Math.min(1, Math.max(0, (px - padL) / innerW));
      const idx = Math.round(frac * (DATA.length - 1));
      const d = DATA[idx];
      const xx = xScale(d.step), yy = yScale(d[field]);
      crosshair.setAttribute("x1", xx); crosshair.setAttribute("x2", xx);
      crosshair.setAttribute("opacity", 1);
      hoverDot.setAttribute("cx", xx); hoverDot.setAttribute("cy", yy);
      hoverDot.setAttribute("opacity", 1);
      if (tooltip){
        tooltip.innerHTML = `step ${d.step} · epoch ${d.epoch}<br>${field}: ${fmt(d[field])}`;
        tooltip.style.opacity = 1;
        const holderRect = svg.parentElement.getBoundingClientRect();
        tooltip.style.left = ((xx/W)*holderRect.width) + "px";
        tooltip.style.top = ((yy/H)*holderRect.height - 8) + "px";
      }
    }
    function onLeave(){ crosshair.setAttribute("opacity",0); hoverDot.setAttribute("opacity",0); if (tooltip) tooltip.style.opacity = 0; }
    capture.addEventListener("mousemove", onMove);
    capture.addEventListener("mouseleave", onLeave);
    capture.addEventListener("touchmove", e => onMove(e.touches[0]), {passive:true});
    capture.addEventListener("touchend", onLeave);
  }

  const miniFields = [
    ["loss_cls","detection cls"], ["loss_bbox","detection bbox"],
    ["loss_traj","agent traj"], ["loss_traj_cls","agent traj cls"],
    ["loss_map_cls","map cls"], ["loss_map_pts","map pts"],
    ["loss_map_dir","map dir"], ["grad_norm","grad norm"],
    ["loss_occ_cls","occ cls"], ["loss_occ_height","occ height"]
  ];
  let miniBuilt = false;
  function ensureMiniPanels(){
    if (miniBuilt) return;
    const grid = document.getElementById("mini-grid");
    grid.innerHTML = "";
    miniFields.forEach(([field,label]) => {
      const panel = document.createElement("div");
      panel.className = "mini-panel";
      panel.dataset.field = field;
      panel.innerHTML = `<h3>${label}</h3><p class="mini-value" data-role="value">–</p><div class="chart-holder"><svg class="chart" viewBox="0 0 220 90" preserveAspectRatio="none"></svg></div>`;
      grid.appendChild(panel);
    });
    miniBuilt = true;
  }

  function render(){
    if (DATA.length === 0) return;
    document.getElementById("empty-state").hidden = true;
    document.getElementById("dashboard").hidden = false;
    ensureMiniPanels();

    const last = DATA[DATA.length-1], first = DATA[0];
    buildChart(document.getElementById("hero-chart"), "loss", { labelEpochs:true, showCheckpoints:true, tooltipEl: document.getElementById("hero-tooltip"), height:260 });
    document.getElementById("hero-value").innerHTML = fmt(last.loss,2) + `<span>epoch ${last.epoch} · step ${last.step} · started at ${fmt(first.loss,2)}</span>`;

    document.querySelectorAll(".mini-panel").forEach(panel => {
      const field = panel.dataset.field;
      if (!(field in last)) { panel.style.display = "none"; return; }
      panel.style.display = "";
      const lastV = last[field], firstV = first[field];
      const down = lastV < firstV;
      panel.querySelector('[data-role="value"]').innerHTML =
        `${fmt(lastV,3)}<span class="delta ${down?'down':'up'}">${down?'▾':'▴'} from ${fmt(firstV,3)}</span>`;
      buildChart(panel.querySelector("svg"), field, { height:90 });
    });
  }

  function renderMeta(payload){
    const metaRow = document.getElementById("meta-row");
    const epochs = Object.keys(epochStarts());
    const latestEpoch = DATA.length ? DATA[DATA.length-1].epoch : "–";
    metaRow.innerHTML = `
      <span class="meta-chip">run <b>${payload.run || "–"}</b></span>
      <span class="meta-chip">watching <b>${payload.work_dir || "–"}</b></span>
      <span class="meta-chip">epoch <b>${latestEpoch}</b></span>
      <span class="meta-chip">checkpoints saved: <b>${(payload.checkpoints||[]).length ? payload.checkpoints.join(", ") : "none yet"}</b></span>
    `;
    document.getElementById("footer-note").innerHTML =
      `Polling <code>${payload.scalars_path || "scalars.json"}</code> every ${(payload.poll_ms/1000).toFixed(0)}s. ` +
      `<code>loss_map_bbox</code>, <code>loss_map_iou</code>, and all <code>loss_plan_*</code> terms are omitted when pinned at exactly 0.0.`;
  }

  async function poll(){
    try {
      const res = await fetch("/data", {cache: "no-store"});
      const payload = await res.json();
      DATA = payload.records || [];
      CKPT_EPOCHS = payload.checkpoints || [];
      renderMeta(payload);
      render();
      lastUpdate = Date.now();
      document.getElementById("status-dot").classList.add("live");
      document.getElementById("status-text").textContent = DATA.length ? "live" : "waiting for data";
    } catch (e) {
      document.getElementById("status-dot").classList.remove("live");
      document.getElementById("status-text").textContent = "connection lost, retrying…";
    }
  }

  setInterval(() => {
    if (lastUpdate) {
      const secs = Math.round((Date.now()-lastUpdate)/1000);
      const el = document.getElementById("status-text");
      if (el.textContent === "live" || el.textContent.startsWith("live")) el.textContent = `live · updated ${secs}s ago`;
    }
  }, 1000);

  poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
